name: Base workflow proposal
description: 底座維護專用：提出可重用的公開控制、模式、模板或工作流程改進。
title: "[Base proposal]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and observed cost
      description: What base-level failure or cost does this address? A proven content error can be corrected without waiting for recurrence.
    validations:
      required: true
  - type: textarea
    id: existing-guidance
    attributes:
      label: Existing guidance and diagnosis
      description: Identify the owning section and retrieval or execution evidence. Distinguish a rule gap, ambiguity, conflict, over-restriction, routing or tool gap, or new context. Mark missing evidence Unknown; use public or synthetic sources only.
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: Trigger and non-trigger cases
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest proposed base landing point
      description: Correct the current owner, improve routing or execution, add an example, retain the case, or propose a new control. Explain why the existing owner can or cannot handle it.
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: Verification, operator cost, and pruning condition
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public safety
      options:
        - label: Examples are synthetic and contain no private or identifying data.
          required: true
