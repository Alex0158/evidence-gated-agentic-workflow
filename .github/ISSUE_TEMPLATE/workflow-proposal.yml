name: Workflow proposal
description: Propose a reusable control, pattern, template, or workflow improvement.
title: "[Proposal]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and observed cost
      description: What failure or cost does this address? A proven content error does not need to recur before correction.
    validations:
      required: true
  - type: textarea
    id: existing-guidance
    attributes:
      label: Existing guidance and diagnosis
      description: Identify the owning section, event-time rule and retrieval/execution evidence, and any later correction. Distinguish a rule gap, ambiguity, conflict, over-restriction, routing/execution/tool gap, or new context. Mark missing evidence Unknown; use only public or synthetic sources.
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: Trigger and non-trigger cases
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest proposed landing point
      description: Correct existing guidance, improve routing/execution, add an example, retain the case, or propose a new control. Explain why the existing owner can or cannot handle it.
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: Verification, operator cost, and pruning condition
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public safety
      options:
        - label: Examples are synthetic and contain no private or identifying data.
          required: true
