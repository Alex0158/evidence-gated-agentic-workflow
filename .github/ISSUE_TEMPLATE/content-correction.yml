name: Base content or evidence correction
description: 底座維護專用：回報公開底座中錯誤、過時、矛盾或超出 evidence 的內容。
title: "[Base correction]: "
labels: [documentation]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Identify the base statement that is incorrect, stale, contradictory, or too broad.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Public evidence or source
      description: Link to a public source. Do not include private data, credentials, or personal paths.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction and claim boundary
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public safety
      options:
        - label: This report contains no credentials, personal data, customer data, private system details, or private audit material.
          required: true
